name: Deploy to Nekoweb

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
        -   name: Checkout code
            uses: actions/checkout@v4

        
        -   name: deploy2nekoweb
            uses: indiefellas/deploy2nekoweb@main
            with:
                nekoweb-api-key: ${{ secrets.NEKOWEB_API_KEY }}
                nekoweb-domain: 'rov.nekoweb.org'
                nekoweb-username: 'rov'
                directory: 'nekoweb'