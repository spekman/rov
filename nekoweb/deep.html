<!DOCTYPE html>
<html lang="pt">

<head>
	<title>welcome</title>

	<meta name="viewport" content="width=device-width, initial-scale=0.1">

	<style>
		:root {
			--background-height:338px;
			--background-width: 600px;
		}
		html {
			background-color: var(--secondary-color);
			image-rendering: pixelated;
		}

        body {
            background: url(src/42.png);
			background-size: cover;
			color: #FFF;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
			animation: moveBg 2s linear infinite;
        }

		@keyframes moveBg {
			0% { background-position: 0; }
			100% { background-position: 100vw;}
		}

        .moving-bg {
            position: absolute;
			top: 0;
			bottom: 0;
			left: 0;
			right: 0;
            background-image: url(src/dust.png);
			opacity: 0.3;
			background-repeat: repeat;
			mix-blend-mode: lighten;
            animation: panBg 1.1s linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes panBg {
            0% { background-position: 0 0; }
            100% { background-position: var(--background-width) calc(-1 * var(--background-height)); }
        }

        .whale-container {
            position: relative;
            z-index: 2;
            width: 720px;
            height: 480px;
            mask-image: url(/src/whale.gif);
            mask-size: contain;
            mask-repeat: no-repeat;
            mask-position: center;
            
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .whale-inner-content {
            width: 100%;
            height: 100%;
            background: url(src/bsod.png);
            background-size: cover;
            display: flex;
            padding: 10px;
            cursor: pointer;
        }

	</style>

</head>

<body>
	<div class="moving-bg"></div>
    <div class="whale-container" onclick="window.location.href = 'home.html'">
        <div class="whale-inner-content">
        </div>
    </div>
</body>
</html>
