<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome</title>
    <link rel="stylesheet" href="global.css">
    <style>
        body {
            image-rendering: pixelated;
            margin: 0;
            height: 100vh;
            background-size: cover;
            background-image: url(src/bg.png);
            background-position: center;
            background-color: #000;
            display: grid;
            place-items: center;
        }

        img {
            position: relative;
            z-index: 3;
        }

        #paint {
            position: absolute;
            background-image: url(src/bsod.png);
            height: 500px;
            width: 417px;
            cursor: pointer;
        }

        #paint:hover {
            background-image: url(src/bsod.png), url(src/glitch.gif);
            background-blend-mode: lighten;
        }

        #face {
            z-index: 1;
            position: inherit;
            background-image: url(src/fire.webp);
            background-size: cover;
            width: 100%;
            height: 100%;
            filter: hue-rotate(30deg);
            mask-mode: luminance;
            mask-position: 60px 40px;
            mask-size: 380px;
            mask-repeat: no-repeat;
            mask-image: url(src/face.gif);
        }

        #paint-overlay {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            background-image: url(src/paint.png);
        }
        span {
            position: absolute;
            top: 20px;
        }
    </style>
</head>

<body>
    <div class="crt"></div>
    <span>it's not safe out there. not anymore</span>
    <div id="paint" onclick="window.location.href = 'home.html'">
        <div id="face"></div>
        <div id="paint-overlay"></div>
    </div>
</body>

</html>
