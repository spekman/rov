<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>void</title>
    <link rel="stylesheet" href="global.css">
    <style>
        body {
            position: absolute;
            margin: 0;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #00a;
            color: white;
            align-content: center;
            overflow: hidden;
        }

        pre {
            user-select: none;
            max-width: 100vw;
            white-space: pre-wrap;
        }

        #clouds {
            position: absolute;
            background: url(src/clouds.png) repeat;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            animation: slide 60s infinite linear;

            z-index: -1;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            background-image: url(src/bliss.png);
            background-size: cover;
            position: absolute;
            bottom: 0;
            top: 40%;
            width: 100%;

        }

        main::before {
            content: " Windows ";
            white-space-collapse: preserve;
            background-color: #d1d1d1;
            color: #00a;
        }

        @keyframes slide {
            0% {
                background-position: 0 0;
            }

            100% {
                background-position: -960px 0;
            }
        }
    </style>
</head>

<body onclick="window.location.href = 'index.html'" onkeypress="window.location.href = 'index.html'">
    <div class="crt"></div>
    <main>
        <pre>

    </pre>
    </main>
    <div id="clouds"></div>
</body>

</html>
